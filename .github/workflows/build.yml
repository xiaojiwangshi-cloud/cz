name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Rebuild & Guard Project
        run: |
          echo "=== 1. 规避 AndroidX 与编译内存问题 ==="
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          echo "=== 2. 规范项目目录结构 ==="
          mkdir -p clean_app/src/main/java/com/chenzhuang/patrolreporter
          mkdir -p clean_app/src/main/res/values
          mkdir -p clean_app/src/main/res/xml

          # 抓取用户代码
          find . -name "MainActivity.kt" -exec cp {} clean_app/src/main/java/com/chenzhuang/patrolreporter/ \;
          find . -name "AndroidManifest.xml" -exec cp {} clean_app/src/main/ \;
          find . -name "file_paths.xml" -exec cp {} clean_app/src/main/res/xml/ \;

          # 确保必须的 strings.xml 和 values 存在，防止资源打包中断
          cat << 'EOF' > clean_app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">陈壮巡检问题</string>
          </resources>
          EOF

          rm -rf app
          mv clean_app app

          echo "=== 3. 注入稳定版构建脚本 ==="
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.chenzhuang.patrolreporter"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.chenzhuang.patrolreporter"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.apache.poi:poi:5.2.5")
              implementation("org.apache.poi:poi-ooxml:5.2.5")
          }
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChenZhuangPatrol"
          include(":app")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 陈壮巡检问题-安装包
          path: app/build/outputs/apk/debug/*.apk
